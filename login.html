<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover"
    />
    <title>Themis - Đăng nhập</title>

    <link
      rel="icon"
      href="https://investornguyencaovu2711-eng.github.io/themis/images/favicon.png"
      type="image/webp"
      sizes="96x96"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      body {
        background:
          linear-gradient(rgba(255, 255, 255, 0.75), rgba(255, 255, 255, 0.75)),
          url("images/hinhnen.jpg") no-repeat center center fixed;
        background-size: cover;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
      }

      .phone-container {
        width: 100%;
        max-width: 412px;
        height: 100vh;
        height: 100dvh;
        max-height: 892px;
        background-color: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        display: flex;
        flex-direction: column;
        overflow-y: auto;
        border-radius: 24px;
        position: relative;
      }

      @media (max-width: 450px) {
        .phone-container {
          border-radius: 0;
          max-height: 100dvh;
          padding-top: env(safe-area-inset-top);
          padding-bottom: env(safe-area-inset-bottom);
        }
      }

      .login-wrap {
        display: flex;
        flex-direction: column;
        justify-content: center;
        flex: 1;
        padding: 40px 24px;
      }

      .brand-logo {
        text-align: center;
        margin-bottom: 20px;
      }

      .brand-logo .logo-img {
        width: 150px;
        height: auto;
        display: block;
        margin: 0 auto;
      }

      .login-card h2 {
        font-size: 24px;
        margin-bottom: 24px;
        color: #1a202c;
        font-weight: 700;
        text-align: center;
      }

      /* Khung Dropdown chọn tài khoản */
      .dropdown-box {
        margin-bottom: 20px;
      }

      .account-select-wrapper {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      select.account-dropdown {
        flex: 1;
        padding: 14px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        outline: none;
        background-color: #f8fafc;
        color: #1a202c;
        cursor: pointer;
      }

      select.account-dropdown:focus {
        border-color: #2563eb;
        background-color: #ffffff;
      }

      .btn-delete-current {
        padding: 0 14px;
        height: 50px;
        background-color: #fee2e2;
        color: #dc2626;
        border: 1px solid #fecaca;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        transition: background 0.2s;
      }

      .btn-delete-current:hover {
        background-color: #fecaca;
      }

      .btn-add-new-acc {
        background: none;
        border: none;
        color: #2563eb;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        padding: 4px 0;
        margin-top: 6px;
        display: inline-block;
      }

      .btn-add-new-acc:hover {
        text-decoration: underline;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .password-group {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 16px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #718096;
        display: flex;
        align-items: center;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #718096;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        font-size: 16px !important;
        font-weight: 600;
        outline: none;
        background-color: #f8fafc;
        color: #1a202c;
      }

      input:focus {
        border-color: #2563eb;
        background-color: #ffffff;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .btn-login {
        width: 100%;
        min-height: 52px;
        padding: 14px;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 700;
        color: white;
        cursor: pointer;
        background-color: #2563eb;
        margin-top: 10px;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
      }

      .btn-login:active {
        opacity: 0.8;
        transform: scale(0.98);
      }

      .login-alert {
        padding: 14px;
        border-radius: 12px;
        font-size: 14px;
        margin-bottom: 20px;
        display: none;
        text-align: center;
      }

      .toggle-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #2563eb;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="phone-container">
      <div class="login-wrap">
        <div class="brand-logo">
          <img src="images/logo.webp" alt="Themis logo" class="logo-img" />
        </div>

        <div class="login-card">
          <h2 id="formTitle">Đăng nhập</h2>
          <div id="alertBox" class="login-alert"></div>

          <!-- TRÌNH ĐƠN THẢ XUỐNG CHỌN TÀI KHOẢN ĐÃ LƯU -->
          <div
            id="savedAccountsSection"
            class="dropdown-box"
            style="display: none"
          >
            <label>Chọn tài khoản đã lưu</label>
            <div class="account-select-wrapper">
              <select id="accountDropdown" class="account-dropdown">
                <!-- Các option tài khoản sẽ được render bằng JS -->
              </select>
              <button
                type="button"
                id="btnRemoveSelected"
                class="btn-delete-current"
                title="Xóa tài khoản này khỏi danh sách"
              >
                Xóa
              </button>
            </div>
            <div>
              <button
                type="button"
                class="btn-add-new-acc"
                id="btnShowAddAccount"
              >
                + Đăng nhập tài khoản khác
              </button>
            </div>
          </div>

          <form id="loginForm">
            <!-- Ô nhập username (Chỉ hiện khi chưa có tài khoản nào hoặc khi bấm Thêm tài khoản khác) -->
            <div class="form-group" id="usernameGroup">
              <label>TÊN ĐĂNG NHẬP / EMAIL</label>
              <input type="text" id="username" required />
            </div>

            <div class="form-group">
              <label>MẬT KHẨU</label>
              <div class="password-group">
                <input type="password" id="password" required />
                <button
                  type="button"
                  class="password-toggle"
                  onclick="togglePassword('password', this)"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="20"
                    height="20"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path
                      d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>

            <div style="text-align: right; margin-bottom: 15px">
              <a
                href="resetpassword.html"
                style="
                  font-size: 14px;
                  color: #2563eb;
                  font-weight: 600;
                  text-decoration: none;
                "
                >Quên mật khẩu?</a
              >
            </div>

            <button type="submit" class="btn-login" id="btnLogin">
              Đăng nhập
            </button>
            <span class="toggle-link" id="showRegisterLink"
              >Chưa có tài khoản? Đăng ký ngay</span
            >
          </form>

          <!-- Form đăng ký giữ nguyên -->
          <form id="registerForm" style="display: none">
            <div class="form-group">
              <label>TÊN ĐĂNG NHẬP</label>
              <input type="text" id="reg_username" required />
            </div>
            <div class="form-group">
              <label>EMAIL</label>
              <input type="email" id="reg_email" required />
            </div>
            <div class="form-group">
              <label>HỌ VÀ TÊN</label>
              <input type="text" id="reg_HovaTen" required />
            </div>
            <div class="form-group">
              <label>SỐ ĐIỆN THOẠI</label>
              <input type="text" id="reg_SoDienThoai" required />
            </div>
            <div class="form-group">
              <label>MẬT KHẨU</label>
              <input type="password" id="reg_password" required />
            </div>
            <div class="form-group">
              <label>TÊN NGÂN HÀNG</label>
              <input type="text" id="reg_NganHang" required />
            </div>
            <div class="form-group">
              <label>SỐ TÀI KHOẢN</label>
              <input type="text" id="reg_SoTaiKhoan" required />
            </div>
            <button type="submit" class="btn-login" id="btnRegister">
              Đăng ký
            </button>
            <span class="toggle-link" id="showLoginLink"
              >Đã có tài khoản? Đăng nhập tại đây</span
            >
          </form>
        </div>
      </div>
    </div>

    <script>
      const API_BASE_URL = "https://api.themis.id.vn";

      // Khi trang tải xong: Đọc danh sách tài khoản đã lưu vào dropdown
      document.addEventListener("DOMContentLoaded", () => {
        renderDropdown();
      });

      function getSavedAccounts() {
        try {
          return (
            JSON.parse(localStorage.getItem("themis_saved_accounts")) || []
          );
        } catch (e) {
          return [];
        }
      }

      function renderDropdown() {
        const accounts = getSavedAccounts();
        const section = document.getElementById("savedAccountsSection");
        const dropdown = document.getElementById("accountDropdown");
        const usernameGroup = document.getElementById("usernameGroup");
        const usernameInput = document.getElementById("username");

        if (accounts.length > 0) {
          section.style.display = "block";
          dropdown.innerHTML = "";

          accounts.forEach((acc) => {
            const opt = document.createElement("option");
            opt.value = acc.username;
            opt.textContent = `${acc.name || acc.username} (${acc.username})`;
            dropdown.appendChild(opt);
          });

          // Ẩn ô nhập username đi, dùng giá trị từ dropdown
          usernameGroup.style.display = "none";
          usernameInput.removeAttribute("required");
        } else {
          // Nếu chưa có tài khoản nào được lưu -> Ẩn dropdown, hiện ô nhập input trắng
          section.style.display = "none";
          usernameGroup.style.display = "block";
          usernameInput.setAttribute("required", "true");
        }
      }

      // Xử lý sự kiện khi bấm nút "Xóa" tài khoản đang chọn trong dropdown
      document
        .getElementById("btnRemoveSelected")
        .addEventListener("click", () => {
          const dropdown = document.getElementById("accountDropdown");
          const usernameToRemove = dropdown.value;
          if (!usernameToRemove) return;

          if (
            confirm(
              `Bạn có chắc muốn xóa tài khoản "${usernameToRemove}" khỏi danh sách đã lưu?`,
            )
          ) {
            let accounts = getSavedAccounts();
            accounts = accounts.filter(
              (acc) => acc.username !== usernameToRemove,
            );
            localStorage.setItem(
              "themis_saved_accounts",
              JSON.stringify(accounts),
            );

            // Cập nhật lại giao diện dropdown
            renderDropdown();
            document.getElementById("password").value = "";
          }
        });

      // Nút chuyển sang chế độ nhập tài khoản mới thủ công
      document
        .getElementById("btnShowAddAccount")
        .addEventListener("click", () => {
          const section = document.getElementById("savedAccountsSection");
          const usernameGroup = document.getElementById("usernameGroup");
          const usernameInput = document.getElementById("username");

          section.style.display = "none"; // Ẩn dropdown tạm thời
          usernameGroup.style.display = "block";
          usernameInput.setAttribute("required", "true");
          usernameInput.value = "";
          document.getElementById("password").value = "";
          usernameInput.focus();
        });

      function togglePassword(inputId, button) {
        const passwordInput = document.getElementById(inputId);
        if (passwordInput.type === "password") {
          passwordInput.type = "text";
        } else {
          passwordInput.type = "password";
        }
      }

      function showAlert(message, isSuccess = false) {
        const alertBox = document.getElementById("alertBox");
        alertBox.innerText = message;
        alertBox.style.display = "block";
        alertBox.style.backgroundColor = isSuccess ? "#dcfce7" : "#fef2f2";
        alertBox.style.color = isSuccess ? "#166534" : "#991b1b";
        alertBox.style.border = isSuccess
          ? "1px solid #bbf7d0"
          : "1px solid #fecaca";
      }

      document
        .getElementById("showRegisterLink")
        .addEventListener("click", () => {
          document.getElementById("loginForm").style.display = "none";
          document.getElementById("registerForm").style.display = "block";
          document.getElementById("formTitle").innerText = "Đăng ký tài khoản";
          document.getElementById("alertBox").style.display = "none";
        });

      document.getElementById("showLoginLink").addEventListener("click", () => {
        document.getElementById("registerForm").style.display = "none";
        document.getElementById("loginForm").style.display = "block";
        document.getElementById("formTitle").innerText = "Đăng nhập";
        document.getElementById("alertBox").style.display = "none";
      });

      // Xử lý gửi form Đăng nhập
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("btnLogin");
          document.getElementById("alertBox").style.display = "none";
          btn.disabled = true;
          btn.innerText = "Đang xác thực...";

          // Lấy username từ dropdown (nếu đang hiển thị) hoặc từ ô input thủ công
          const dropdownSection = document.getElementById(
            "savedAccountsSection",
          );
          let loginUsername = "";
          if (dropdownSection.style.display !== "none") {
            loginUsername = document.getElementById("accountDropdown").value;
          } else {
            loginUsername = document.getElementById("username").value.trim();
          }
          const loginPassword = document.getElementById("password").value;
          const savedDeviceToken = localStorage.getItem(
            "themis_trusted_device_token",
          );

          try {
            const res = await fetch(`${API_BASE_URL}/login`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              credentials: "include",
              body: JSON.stringify({
                username: loginUsername,
                password: loginPassword,
                device_token: savedDeviceToken,
              }),
            });

            const data = await res.json();

            if (data && data.status === "success") {
              // Lưu tài khoản đăng nhập thành công vào mảng danh sách trong localStorage
              let accounts = getSavedAccounts();
              const currentAcc = {
                username: data.username || loginUsername,
                name: data.HovaTen || loginUsername,
              };

              const existingIndex = accounts.findIndex(
                (acc) => acc.username === currentAcc.username,
              );
              if (existingIndex >= 0) {
                accounts[existingIndex] = currentAcc; // Cập nhật thông tin mới nhất
              } else {
                accounts.unshift(currentAcc); // Đưa lên đầu danh sách
              }

              localStorage.setItem(
                "themis_saved_accounts",
                JSON.stringify(accounts),
              );
              if (data.token) {
              }

              window.location.href = "trangchu.html";
            } else {
              showAlert(data?.message || "Sai thông tin đăng nhập!");
              btn.disabled = false;
              btn.innerText = "Đăng nhập";
            }
          } catch (error) {
            showAlert("Lỗi kết nối máy chủ!");
            btn.disabled = false;
            btn.innerText = "Đăng nhập";
          }
        });
    </script>
  </body>
</html>
